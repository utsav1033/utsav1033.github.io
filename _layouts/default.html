<!doctype html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body>
<main class="page">
<button class="theme-toggle" type="button" aria-label="Switch between light and dark">
  <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
  <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/></svg>
</button>
{{ content }}
<footer>
  <div class="tailpiece" aria-hidden="true">❧</div>
  <p class="finis">~ fin ~</p>
  <p>{{ site.data.profile.footer }}</p>
</footer>
</main>
<script>
(function(){var b=document.querySelector('.theme-toggle'),r=document.documentElement;
  function dark(){var t=r.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
  b.addEventListener('click',function(){var n=dark()?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('theme',n)}catch(e){}});
})();
</script>
</body>
</html>
