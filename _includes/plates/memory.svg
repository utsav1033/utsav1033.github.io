<circle class="hollow" cx="128.0" cy="145.4" r="4"/>
<path class="leader" d="M 128.0 152.4 V 161.4"/><text class="sm" x="128.0" y="173.4" text-anchor="middle">ii</text>
<circle class="hollow" cx="199.8" cy="135.5" r="4"/>
<path class="leader" d="M 199.8 142.5 V 151.5"/><text class="sm" x="199.8" y="163.5" text-anchor="middle">iii</text>
<circle class="hollow" cx="270.9" cy="120.3" r="4"/>
<path class="leader" d="M 270.9 127.3 V 136.3"/><text class="sm" x="270.9" y="148.3" text-anchor="middle">iv</text>
<circle class="hollow" cx="341.4" cy="99.7" r="4"/>
<path class="leader" d="M 341.4 106.7 V 115.7"/><text class="sm" x="341.4" y="127.7" text-anchor="middle">v</text>
<circle class="hollow" cx="409.7" cy="74.3" r="4"/>
