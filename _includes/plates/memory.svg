<path class="ret" d="M 470.2 38.0 Q 338.0 -26.0 201.8 127.5"/>
<text class="red" x="358.0" y="18.0" text-anchor="middle">return to iii: load it, don’t replay</text>
<g class="present" style="offset-path:path('M 36 150 C 170 150, 330 120, 492 36');offset-rotate:0deg"><circle class="ring" r="10"/><circle class="body" r="4.6"/></g>
</g>
<g transform="translate(14,22)"><circle class="body" cx="0" cy="0" r="4"/><text x="10" y="4">the present step, the only one in context</text><circle class="hollow" cx="0" cy="18" r="4"/><text x="10" y="22">a step saved to disk once it checked out</text></g>
</svg>
