<svg class="plate-taskmaster" viewBox="0 0 520 214" role="img" aria-label="Seven steps along a course, each saved to disk. A dark body marks the one step held in context; it moves forward step by step, then returns to step three by loading it.">
<g transform="translate(0,28)">
