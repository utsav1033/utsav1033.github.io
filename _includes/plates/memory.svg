<svg class="plate-memory" viewBox="0 0 540 266" role="img" aria-label="A small belief state held in context drives the agent, which acts in the app; each change is verified, appended as a proven diff to a long ledger on disk, and folded back into the belief state. Rewinding loads the belief state from the ledger up to an earlier step instead of replaying the session.">
<style>.plate-memory .mk{fill:none;stroke:var(--muted);stroke-width:.8}.plate-memory .tape{fill:var(--card);stroke:var(--ink);stroke-width:1}.plate-memory .ent{stroke:var(--ink);stroke-width:.7}.plate-memory .ent-r{stroke:var(--red);stroke-width:.9}.plate-memory .gate{fill:var(--card);stroke:var(--ink);stroke-width:1.1}.plate-memory .chk{fill:none;stroke:var(--ink);stroke-width:1.3}.plate-memory .slot{fill:none;stroke:var(--ink);stroke-width:.8;stroke-dasharray:1.5 2}.plate-memory .head{fill:var(--ink);animation:mhead 7s ease-in-out infinite}.plate-memory .dot{fill:var(--ink);offset-rotate:0deg;animation:mdot 7s linear infinite}@keyframes mdot{0%{offset-distance:0%;opacity:0}5%{opacity:1}70%{offset-distance:100%;opacity:1}74%,100%{offset-distance:100%;opacity:0}}@keyframes mhead{0%,70%{opacity:0}76%,96%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.plate-memory .dot{display:none}.plate-memory .head{animation:none;opacity:1}}</style>
