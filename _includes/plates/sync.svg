<svg class="plate-sync" viewBox="0 0 540 222" role="img" aria-label="Timeline from the prompt to 27 seconds. Both models start at once. The fast model thinks briefly, then does steps 1 to 4 while the slow model is still thinking. At 6 seconds the slow model is ready, takes over at step 5, and the fast model stops. The slow model does steps 5 to 11 quickly and finishes at 19 seconds; alone it would have finished at 27 seconds, 8 seconds later.">
<style>.plate-sync .tl{stroke:var(--rule);stroke-width:.7;stroke-dasharray:1 3}.plate-sync .ax{stroke:var(--hair);stroke-width:.7}.plate-sync .ln{stroke:var(--ink);stroke-width:1.3;fill:none}.plate-sync .ghost{stroke:var(--hair);stroke-width:1.1;stroke-dasharray:2 3;fill:none}.plate-sync .think{fill:var(--card);stroke:var(--ink);stroke-width:1}.plate-sync .hatch{stroke:var(--muted);stroke-width:.7}.plate-sync .step{fill:var(--card);stroke:var(--ink);stroke-width:1.2}.plate-sync .num{font-size:11.5px;fill:var(--ink)}.plate-sync .hand{stroke:var(--red);stroke-width:1.1;fill:none;stroke-dasharray:3 2.5}.plate-sync .save{stroke:var(--red);stroke-width:1;fill:none}</style>
