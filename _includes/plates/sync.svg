<svg class="plate-sync" viewBox="0 0 540 168" role="img" aria-label="Two lines: the fast model takes many quick steps, the slow model fewer, later ones. A slow-model step the fast model already did is skipped. A send step is checked before it runs. The task drops from 27 to 19 seconds.">
<style>.plate-sync .lane{fill:none;stroke:var(--hair);stroke-width:1}.plate-sync .skip{fill:var(--card);stroke:var(--muted);stroke-width:1;stroke-dasharray:2 1.6}.plate-sync .strike{fill:none;stroke:var(--ink);stroke-width:1.2}.plate-sync .chk{fill:var(--card);stroke:var(--red);stroke-width:1.3}.plate-sync .bar{fill:none;stroke:var(--ink);stroke-width:1.4}</style>
<text x="16" y="61">slow model</text><text x="16" y="123">fast model</text>
<path class="lane" d="M 124 56 H 524 M 124 118 H 436"/>
<circle class="body" cx="144" cy="118" r="4"/>
<circle class="body" cx="172" cy="118" r="4"/>
<circle class="body" cx="200" cy="118" r="4"/>
<circle class="body" cx="228" cy="118" r="4"/>
<circle class="body" cx="256" cy="118" r="4"/>
<circle class="body" cx="284" cy="118" r="4"/>
<circle class="body" cx="312" cy="118" r="4"/>
<circle class="body" cx="340" cy="118" r="4"/>
<circle class="body" cx="400" cy="118" r="4"/>
<path class="bar" d="M 436 108 V 128"/>
<text x="448" y="123">27 s → 19 s</text>
<rect class="skip" x="247" y="51" width="10" height="10"/>
<path class="strike" d="M 244 64 L 260 48"/>
<rect class="body" x="347" y="51" width="10" height="10"/>
<rect class="body" x="447" y="51" width="10" height="10"/>
<path class="guide" d="M 248 64 L 176 112"/>
<text x="252" y="40" text-anchor="middle">already done, skipped</text>
<path class="ret" d="M 372 56 V 109"/>
<circle class="chk" cx="372" cy="118" r="8"/>
<path class="hold" style="fill:none;stroke:var(--red);stroke-width:1.3" d="M 368.4 118.3 l 2.6 2.8 l 4.8 -6"/>
<text class="red" x="372" y="148" text-anchor="middle">send, checked first</text>
</svg>
