<svg class="plate-sync" viewBox="0 0 540 210" role="img" aria-label="Two lanes: the slow model plans steps along the top, the fast model acts along the bottom. Between them a sync layer skips steps already done, drops a stale plan, and holds irreversible actions like send or delete at a gate until checked against the task.">
<text x="0" y="36">slow model</text><text class="sm" x="0" y="52">plans</text>
<text x="0" y="176">fast model</text><text class="sm" x="0" y="192">acts</text>
<path class="leader" d="M 96 40 H 532"/><path class="leader" d="M 96 180 H 532"/>
<rect class="bx" x="112" y="28" width="66" height="24" rx="2"/>
<text class="" x="145" y="45" text-anchor="middle">step 1</text>
<path class="leader" d="M 118 40 H 172"/>
<path class="ray" d="M 145 52 V 86"/>
<rect class="bx-r" x="196" y="28" width="66" height="24" rx="2"/>
<text class="red" x="229" y="45" text-anchor="middle">step 2</text>
<path class="lnr" d="M 202 40 H 256"/>
<path class="ray" d="M 229 52 V 86"/>
<rect class="bx" x="280" y="28" width="66" height="24" rx="2"/>
<text class="" x="313" y="45" text-anchor="middle">step 3</text>
<path class="ray" d="M 313 52 V 86"/>
<rect class="bx" x="364" y="28" width="66" height="24" rx="2"/>
<text class="" x="397" y="45" text-anchor="middle">step 4</text>
<path class="ray" d="M 397 52 V 86"/>
<rect class="bx" x="448" y="28" width="66" height="24" rx="2"/>
<text class="" x="481" y="45" text-anchor="middle">step 5</text>
<path class="ray" d="M 481 52 V 86"/>
<rect class="bx" x="96" y="86" width="436" height="40" rx="3"/>
<text x="108" y="111">sync layer</text>
<text class="sm" x="206" y="111">skips what’s done</text>
<text class="sm" x="318" y="111">drops what’s stale</text>
<text class="sm" x="430" y="111">checks what’s final</text>
<path class="ray" d="M 130 126 V 174"/><circle class="body" cx="130" cy="180" r="4"/>
<path class="ray" d="M 206 126 V 174"/><circle class="body" cx="206" cy="180" r="4"/>
<path class="ray" d="M 282 126 V 174"/><circle class="body" cx="282" cy="180" r="4"/>
<path class="xmark" d="M 446 170 V 190 M 458 170 V 190"/><text class="red" x="452" y="202" text-anchor="middle">send or delete waits</text>
<path class="ray" d="M 452 126 V 164"/>
<circle class="body photon" style="offset-path:path('M 130 180 L 446 180')" r="3"/>
</svg>
