<svg class="plate-qwendoom" viewBox="0 0 540 240" role="img" aria-label="Doom's code and map are written once into the memory of a model, a tall stack of layers. Then, in red, each token the model writes goes back in as the next input, and each token is one step of a CPU.">
<style>
.plate-qwendoom .lay{stroke:var(--hair);stroke-width:.8}
.plate-qwendoom .mem{stroke:var(--ink);stroke-width:1.2}
.plate-qwendoom .arrow{fill:var(--hair)}
.plate-qwendoom .arrow-r{fill:var(--red)}
.plate-qwendoom .loop{stroke-dasharray:5 3;animation:qdmarch 5s linear infinite}
@keyframes qdmarch{to{stroke-dashoffset:-40}}
@media (prefers-reduced-motion:reduce){.plate-qwendoom .loop{animation:none}}
</style>
<text class="name" x="265.0" y="24" text-anchor="middle">the model</text>
<rect class="bx" x="200" y="40" width="130" height="166"/>
<path class="lay" d="M 210 48 H 320"/>
<path class="lay" d="M 210 54 H 320"/>
<path class="lay" d="M 210 60 H 320"/>
<path class="lay" d="M 210 66 H 320"/>
<path class="lay" d="M 210 72 H 320"/>
<path class="lay" d="M 210 78 H 320"/>
<path class="lay" d="M 210 84 H 320"/>
<path class="lay" d="M 210 90 H 320"/>
<path class="lay" d="M 210 96 H 320"/>
<path class="lay" d="M 210 102 H 320"/>
<path class="lay" d="M 210 108 H 320"/>
<path class="mem" d="M 210 114 H 320"/>
<path class="mem" d="M 210 120 H 320"/>
<path class="mem" d="M 210 126 H 320"/>
<path class="mem" d="M 210 132 H 320"/>
<path class="mem" d="M 210 138 H 320"/>
<path class="mem" d="M 210 144 H 320"/>
<path class="mem" d="M 210 150 H 320"/>
<path class="mem" d="M 210 156 H 320"/>
<path class="mem" d="M 210 162 H 320"/>
<path class="mem" d="M 210 168 H 320"/>
<path class="mem" d="M 210 174 H 320"/>
<path class="mem" d="M 210 180 H 320"/>
<path class="mem" d="M 210 186 H 320"/>
<path class="mem" d="M 210 192 H 320"/>
<path class="lay" d="M 210 198 H 320"/>
<path class="leader" d="M 192 112 H 188 V 196 H 192"/>
<text class="sm" x="182" y="128" text-anchor="end">its memory</text>
<text class="sm" x="182" y="144" text-anchor="end">holds the game</text>
<rect class="bx" x="28" y="40" width="96" height="44"/>
<text class="name" x="76" y="62" text-anchor="middle">Doom</text>
<text class="sm" x="76" y="77" text-anchor="middle">code + map</text>
<path class="guide" d="M 76 84 V 170 H 178"/>
<path class="arrow" d="M 178 166 L 185 170 L 178 174 z"/>
<text class="sm" x="28" y="196">written in once,</text>
<text class="sm" x="28" y="212">before the first token</text>
<path class="track-r loop" d="M 330 72 H 402 Q 414 72 414 84 V 162 Q 414 174 402 174 H 342"/>
<path class="arrow-r" d="M 342 169 L 335 174 L 342 179 z"/>
<text class="red" x="426" y="112">each token</text>
<text class="red" x="426" y="130">is one CPU step</text>
<text class="sm" x="426" y="150">~3,700 a second</text>
<text class="sm" x="340" y="64">token out</text>
<text class="sm" x="344" y="194">back in</text>
<text class="sm" x="265.0" y="226" text-anchor="middle">328 layers, nothing trained</text>
</svg>
