{% assign it = include.item %}
<div class="item row">
  <div class="text">{% capture md %}{% if it.name %}<strong class="run">{{ it.name }}</strong> {% endif %}{{ it.text }}{% endcapture %}{{ md | markdownify }}</div>
  {% if it.plate %}
  <figure>
    {% include plates/{{ it.plate }}.svg %}
    <figcaption><span class="fig">Fig. {{ it.fig }}.</span> {{ it.caption }}</figcaption>
  </figure>
  {% endif %}
</div>
