- org: Alma
  url: https://alma.inc
  when: June 2026 – present
  lead: Alma is an agent that uses your Mac’s apps for you. I work on its multi-agent harness.
  items:
    - name: Long-horizon memory for CAD and creative apps
      text: >-
        Photoshop, AutoCAD and Blender tasks run far longer than a model’s context can hold.
        I built the memory that lets the agent work in them at all: every step that checks out
        is saved to disk, only the current one stays in context, and going back to an earlier
        step is a load, not a replay.
      plate: taskmaster
      fig: 1
      title: Long-horizon memory
      caption: The course of a long task. Only the dark step is held in context; the dashed arc is a return to step iii by loading it.
    - name: Fourteen workflows, one word each
      text: >-
        Cross-application workflows that start from a single spoken word and carry a task
        across the browser, productivity and creative apps.
    - name: One decision layer
      text: >-
        Replaced a 72,000-character planning prompt with a single classifier over 27 tools.
        Each turn uses 5,000 fewer tokens, a workflow fires in half the time (765 ms to 388 ms),
        and it picks the right tool more often (97%, up from 94%).
    - name: A fast model and a smart one, in sync
      text: >-
        A fast model acts on screen while a slower, smarter one is still planning. I built the
        layer that keeps them from tripping over each other: it skips steps already done, drops
        plans the fast model made stale, and checks anything irreversible, a send or a delete,
        against the task first. The quickest task fell from 27 s to 19 s.
      plate: sync
      fig: 2
      title: Two models in sync
      caption: The slow model plans along the top, the fast one acts along the bottom. Step 1 is already done, step 2 has gone stale, and a send waits at the gate.
    - name: Run tracing
      text: >-
        Every run now records its steps, model calls, tokens and timings, and why it stopped,
        so one command shows any run on any machine down to the step that broke. What a user
        said leaves their Mac only if they agreed to it.
      plate: tracing
      fig: 3
      title: Run tracing
      caption: Runs from every Mac gather in one place; one command brings any of them into focus.
    - name: Around the pi agent
      text: >-
        Built our multi-agent layer around the pi agent and shipped it as a standalone Rust
        binary, small and quick to start.

- org: Reliance Industries
  when: Dec 2025 – Mar 2026
  lead: >-
    Letter-of-credit parsing with OCR and a local model, 72 s down to 23 s a document at
    3,000 documents a day; demand forecasts for six regions, 27% more accurate.
