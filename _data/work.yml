- org: Alma
  url: https://alma.inc
  when: June 2026 – present
  lead: >-
    Alma is a computer-use interface for macOS: say what you want, and it gets done in
    whatever app it takes. I work on the multi-agent harness underneath.
  items:
    - name: Memory for long sessions
      text: >-
        A real job in Blender, AutoCAD or Photoshop outlasts any context window. I built the
        memory that lets the agent see it through: **context stays the same size at step 5
        and step 500**, and going back to an earlier step is a load, not a replay.
      plate: memory
      fig: 1
      title: Ledger and belief state
      caption: Each verified change is appended to a ledger on disk; context holds only a small belief state, and going back loads it from the ledger.
    - name: One pass to decide
      text: >-
        The planner was a 72,000-character prompt the model reread every turn. I replaced it
        with a one-pass classifier over 27 tools: **tasks 33 s → 19 s**, decisions 765 →
        388 ms, accuracy 94% → 97%, and 5,000 fewer tokens a turn.
    - name: Handing off to a faster model
      text: >-
        The main model starts a task; once a fast model can carry it, the main one stops and
        hands over. My sync layer makes that handoff safe: steps already done are skipped,
        stale plans are dropped, and every send or delete is checked before it runs.
        **Fastest task 27 s → 19 s.**
      plate: sync
      fig: 2
      title: Slow start, fast finish
      caption: The slow model starts the task; once the fast model takes over, the slow one stops and their lines merge.
    - name: Runs that explain themselves
      text: >-
        A failed run used to leave a warning on one tester’s Mac and nothing else. Now every
        run records its steps, model calls, tokens and the reason it stopped, and **one command
        opens any run, on any machine, at the step that broke.**
      plate: tracing
      fig: 3
      title: Tracing a failed run
      caption: Every Mac reports counts and error words, and what the user said only with consent; one command turns any run into a timeline of where it broke.
    - name: Voice workflows
      text: >-
        Shipped **14 workflows that start from a single spoken word** and carry a task across
        the browser, productivity and creative apps.
    - name: The agent, beyond the app
      text: >-
        Built the agent’s CLI, **launching publicly in November 2026**, and ported the
        multi-agent layer, built around the pi agent, into a dictation app as a standalone Rust
        binary tuned for speed and disk size.

