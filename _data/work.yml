- org: Alma
  url: https://alma.inc
  when: June 2026 – present
  lead: >-
    I work on multi-agent harnesses for pure computer use that is cheap, robust and reliable.
    I’ve learnt a lot about how harnesses should be designed, how to handle context cleverly,
    and how to choose between open-source and frontier models based on where each one works
    best. I’ve met some really great people here, and it’s my first hands-on look at how a
    startup works. A few things I worked on:
  items:
    - name: Memory that lasts a whole project
      text: >-
        A real job in Blender or AutoCAD runs to hundreds of steps, far more than a model can
        hold. I built a memory that stays small: the agent works from a short picture of where
        things stand, keeps everything it has verified, and can go back to any point without
        redoing the work.
      plate: memory
      fig: 1
      title: Long-horizon memory
    - name: Symphony of smart (slow) and dumb (fast) agents
      text: >-
        The smart model takes seconds to think. A small, fast model starts acting the moment you
        ask, and the smart one takes over from the first step it hasn’t done. **The fastest task
        went from 27 s to 19 s.**
      plate: sync
      fig: 2
      title: The fast model covers
    - name: Knowing why a run failed
      text: >-
        Every run leaves a trace of each step and model call, with a plain reason when it stops.
        One command opens any run, from any machine, at the step that broke. What people say
        stays on their Mac unless they opt in.
      plate: tracing
      fig: 3
      title: Tracing a failed run
    - name: along the way...
      points:
        - took ownership of 14 automated workflows, like saving or visualising content with a single trigger word.
        - designed robust CLIs for various apps for v0 of the agent.
        - built demos to turn the tech into a product.
        - made the agent’s decision layer faster by capping its token usage, with no loss in accuracy.
        - shipped the command-line version of the beta.

