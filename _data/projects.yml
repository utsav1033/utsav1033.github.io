- org: carmen
  url: https://github.com/utsav1033/carmen
  when: GPU kernels
  items:
    - points:
        - Claude writes Metal kernels for Apple Silicon and carmen trusts none of them. Each is checked against a float64 answer key on hundreds of inputs, some the model never sees, then timed against MLX with error bars.
        - "The judge is tested too: I planted 75 realistic bugs and it caught **all 75**, where the one-input check most benchmarks use caught 40. It also caught two of my own false speedups."
        - "Alone, the kernels beat MLX by up to **1.82×**, wherever MLX runs several small kernels that could be one. Fused into Qwen 2.5 0.5B, they make decode **3% faster** with identical output."
        - "Bigger models taught me the real limit: from 3B up, MLX already decodes at 97% of memory bandwidth. What helps is reading fewer bytes per token, so speculative decoding made Qwen 3B **1.48× faster** at an 8k prompt."
      plate: carmen
      fig: 4
      title: Seven gates, one secret
      caption: The model writes kernels but never grades them. Failures go back with where and why; the hidden draw is never shown to it.

- org: tokenp
  url: https://github.com/utsav1033/jalad-local
  when: local inference
  items:
    - points:
        - Tells you which local LLMs your machine can run, at what quant and how fast, before you download a single gigabyte.
        - "Fit is **weights + KV cache against usable memory**; speed is **memory bandwidth ÷ bytes read per token**. Both recalibrate from your real runs."
        - Then it downloads, loads and chats with the pick on ollama, llama.cpp or MLX, and serves it on an OpenAI-compatible API.
        - "One Rust binary for macOS and Linux: `brew install utsav1033/tap/tokenpati`."
      plate: tokenpati
      fig: 5
      title: What fits, and how fast
      caption: tokenp’s own maths on a 16 GiB M4. The 24B model needs 15 GiB, crosses the usable line, and is never downloaded.

- org: FlowGap
  url: https://github.com/utsav1033/flowgap
  wide: true
  when: voice agents
  items:
    - points:
        - A voice agent can only handle what someone wrote a node for.
        - FlowGap reads its call transcripts and finds what callers actually wanted.
        - It drafts the nodes the flow is missing.
        - In 298 test calls, **49% asked for something the flow couldn’t handle.**
      plate: flowgap
      fig: 6
      title: Where calls leak
      caption: Intents clustered from 298 calls, matched to the flow’s nodes. The cluster with no match becomes a drafted node.
